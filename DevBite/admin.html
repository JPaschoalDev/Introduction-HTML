<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevBite - Painel Administrativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header-admin">
    <div class="logo">DevBite Admin</div>
    <nav>
        <ul>
            <li><a href="#" id="menu-dashboard">Dashboard</a></li>
            <li><a href="#" id="menu-cadastrar">Cadastrar Produto</a></li>
            <li><a href="#" id="menu-relatorios">Relatórios</a></li>
            <li><a href="index.html" id="link-voltar">Voltar ao Cardápio</a></li>
        </ul>
    </nav>
</header>

<main>

    <section>
        <h2>Cadastrar Produto</h2>
        <form id="form-produto">
            <label for="nome-produto">Nome</label>
            <input type="text" id="nome-produto" name="nome">

            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="3"></textarea>

            <label for="preco">Preço</label>
            <input type="number" id="preco" name="preco" step="0.01">

            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoria">
                <option value="burgers">Burgers</option>
                <option value="bebidas">Bebidas</option>
                <option value="sobremesas">Sobremesas</option>
            </select>

            <label for="imagem">Imagem</label>
            <input type="file" id="imagem" name="imagem">

            <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar</button>
        </form>
    </section>

    <section>
        <h2>Pedidos Recentes</h2>
        <div class="tabela-container">
            <table id="tabela-pedidos">
                <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="corpo-pedidos">
                <tr>
                    <td>#001</td>
                    <td>Maria</td>
                    <td>R$ 54,80</td>
                    <td id="status-1">Em preparo</td>
                </tr>
                <tr>
                    <td>#002</td>
                    <td>Pedro</td>
                    <td>R$ 28,90</td>
                    <td id="status-2">Entregue</td>
                </tr>
                <tr>
                    <td>#003</td>
                    <td>Ana</td>
                    <td>R$ 70,30</td>
                    <td id="status-3">Pendente</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer>
    <p>DevBite Admin - Painel de gerenciamento</p>
</footer>

</body>
</html>
